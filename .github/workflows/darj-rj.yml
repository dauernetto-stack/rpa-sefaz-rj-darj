name: RPA DARJ-RJ - lote de pendentes

on:
  workflow_dispatch: {}
  # Reativar o horario automatico somente depois de conferir o primeiro retorno real.
  # schedule:
  #   - cron: '0 11 * * 1-5'

permissions:
  contents: read

concurrency:
  group: emissao-darj-rj
  cancel-in-progress: false

jobs:
  emitir-darj:
    runs-on: self-hosted
    timeout-minutes: 120
    env:
      TZ: America/Sao_Paulo
      HEADLESS: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          # Preserva PDFs de falhas anteriores caso o upload do artefato tenha falhado.
          clean: false
          persist-credentials: false

      - name: Instalar dependencias
        run: python3 -m pip install --break-system-packages -r requirements.txt

      - name: Usar Chrome instalado e liberar cache antigo
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          raiz = Path(os.environ['RUNNER_TOOL_CACHE']).resolve()
          cache = Path('/home/ghrunner/actions-runner/_work/_tool/setup-chrome/chromium')
          chrome = Path('/usr/bin/google-chrome')

          if raiz / 'setup-chrome' / 'chromium' != cache:
              raise RuntimeError('Cache do runner diferente do caminho conferido; limpeza cancelada')
          if cache.resolve() != cache or cache.is_symlink():
              raise RuntimeError('Cache aponta para outro caminho; limpeza cancelada')
          if chrome.resolve(strict=True).is_relative_to(cache):
              raise RuntimeError('Chrome depende do cache; limpeza cancelada')

          subprocess.run([str(chrome), '--version'], check=True)

          for executavel in Path('/proc').glob('[0-9]*/exe'):
              try:
                  caminho = executavel.readlink()
              except OSError:
                  continue
              if caminho.is_relative_to(cache):
                  raise RuntimeError('Existe navegador usando esse cache; limpeza cancelada')

          antes = shutil.disk_usage(raiz).free
          if cache.exists():
              print(f'Removendo somente o cache: {cache}', flush=True)
              shutil.rmtree(cache)
          else:
              print('O cache antigo ja foi removido.')
          depois = shutil.disk_usage(raiz).free
          print(f'Espaco livre antes: {antes / 1024**3:.2f} GiB')
          print(f'Espaco livre depois: {depois / 1024**3:.2f} GiB')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as arquivo:
              arquivo.write(f'CHROME_BINARY={chrome}\n')
          PY

      - name: Validar os testes locais
        run: python3 -m unittest discover -s tests -v

      - name: Recuperar a credencial temporaria do Google
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          payload = base64.b64decode(os.environ['GOOGLE_CREDENTIALS_B64'].strip(), validate=True)
          documento = json.loads(payload)
          if documento.get('type') != 'service_account':
              raise ValueError('Secret nao contem uma credencial de service account')
          descritor = os.open('credenciais.json', os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(descritor, 'w', encoding='utf-8') as arquivo:
              json.dump(documento, arquivo)
          os.chmod('credenciais.json', 0o600)
          PY

      - name: Conferir a planilha antes de emitir
        run: python3 bot.py --validar

      - name: Executar o lote de pendentes
        if: ${{ false }}
        run: python3 bot.py

      - name: Preservar diagnosticos e PDFs para conferencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-darj-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnosticos/**
            downloads_darj/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Remover a credencial temporaria
        if: always()
        run: python3 -c "from pathlib import Path; Path('credenciais.json').unlink(missing_ok=True)"
