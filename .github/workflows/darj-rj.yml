name: RPA DARJ-RJ (emissão automática)

on:
  schedule:
    # 08:00 horário de Brasília (UTC-3, sem horário de verão) = 11:00 UTC,
    # de segunda a sexta. Ajuste o horário/dias aqui se precisar.
    - cron: '0 11 * * 1-5'
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions" do GitHub

jobs:
  emitir-darj:
    # IMPORTANTE: o site da SEFAZ-RJ bloqueia acessos vindos de IPs de
    # datacenter/nuvem fora do Brasil (confirmado em teste real: o runner
    # padrão do GitHub, hospedado no Azure, foi bloqueado). Por isso este
    # job roda num runner "self-hosted": uma VM Linux (Debian 12) no GCP,
    # na região São Paulo, com o agente do GitHub Actions rodando como
    # serviço. Veja o README para o passo a passo de instalação do runner.
    #
    # Essa VM já vem com Python 3 e Google Chrome pré-instalados (feitos
    # na configuração inicial do runner), por isso não usamos a action
    # actions/setup-python aqui - ela não tem build pré-compilado para
    # Debian 12 em runners self-hosted.
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instala dependências Python
        # --break-system-packages é necessário no Debian 12, que protege o
        # Python do sistema (PEP 668) contra "pip install" direto.
        run: python3 -m pip install --break-system-packages -r requirements.txt

      - name: Instala/atualiza o Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Escreve credenciais.json a partir do secret (nunca commitado)
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
        run: echo "$GOOGLE_CREDENTIALS_B64" | base64 -d > credenciais.json

      - name: Roda o robô de emissão do DARJ
        env:
          HEADLESS: "true"
        run: python3 bot.py

      - name: Salva screenshots/HTML de debug como artefato (se houver)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            debug_*.png
            debug_*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Limpeza (credenciais, debug e downloads locais)
        # Diferente do runner hospedado pelo GitHub (que é descartado
        # inteiro após cada job), uma máquina self-hosted é persistente -
        # então limpamos explicitamente ao final de toda execução, mesmo
        # em caso de falha: a credencial (não deve ficar em texto puro no
        # disco entre uma execução e outra), os arquivos de debug (já
        # enviados como artefato no passo anterior) e os PDFs baixados
        # localmente (já enviados ao Google Drive pelo próprio bot.py).
        if: always()
        run: |
          rm -f credenciais.json
          rm -f debug_*.png debug_*.html
          rm -rf downloads_darj
